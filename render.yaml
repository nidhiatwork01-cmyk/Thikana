services:
  # Fastify API Server
  - type: web
    name: thikana-api
    runtime: docker
    dockerContext: .
    dockerfilePath: apps/api/Dockerfile
    plan: free
    region: singapore # Closest to Hyderabad / India
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: thikana-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: thikana-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # Managed Redis for BullMQ & Real-Time Chat
  - type: redis
    name: thikana-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction

databases:
  # PostgreSQL 16 (supports PostGIS via 'CREATE EXTENSION postgis;')
  - name: thikana-db
    databaseName: thikana_db
    user: thikana
    plan: free
    region: singapore

services:
  # Fastify API Server
  - type: web
    name: thikana-api
    runtime: docker
    dockerContext: .
    dockerfilePath: apps/api/Dockerfile
    plan: free
    region: singapore # Closest to Hyderabad / India
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        sync: false # Paste your Supabase Postgres (PostGIS) connection string here
      - key: REDIS_URL
        fromService:
          type: redis
          name: thikana-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # Managed Redis for BullMQ & Real-Time Chat
  - type: redis
    name: thikana-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
